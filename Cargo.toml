[workspace]
resolver = "2"
members = ["crates/engine", "app/src-tauri"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

# Video work is far too slow without optimisation, even while developing.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.engine]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
